name: Frame One real-browser QA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/generate-offline.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'scripts/verify-pages-dist.cjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04 # Playwright 1.55.1 supports Ubuntu 24.04, not Ubuntu 26.04 runners
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Run all regression suites
        run: npm test
      - name: Compile actual production site
        run: npm run build
      - name: Verify Cloudflare Pages publish directory
        run: node scripts/verify-pages-dist.cjs
      - name: Validate Cloudflare Workers static asset deploy (dry run only)
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile smoke checks
        run: node scripts/browser-smoke.cjs
      - name: Upload QA screenshots for review (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-browser-qa-screenshots
          path: qa/screenshots/
          if-no-files-found: warn
