name: Frame One Android full-system backup restore QA

on:
  pull_request:
    paths:
      - '.github/workflows/android-backup-picker-qa.yml'
      - 'scripts/android-emulator-backup.py'
      - 'scripts/android-emulator-learning-state.py'
      - 'scripts/android-emulator-persistence.py'
      - 'src/native-backup.ts'
      - 'src/components/LearnView.tsx'
      - 'src/legacy/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-backup-picker-qa.yml'
      - 'scripts/android-emulator-backup.py'
      - 'src/native-backup.ts'
      - 'src/components/LearnView.tsx'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-android-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform/build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Produce actual debug APK
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npx cap add android
          npx cap sync android
          python3 scripts/render-brand-icons.py --android
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleDebug --no-daemon)
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM for full AOSP emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android DocumentsUI real JSON backup restore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android-emulator-backup.py
      - name: Upload real Android document chooser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-android-full-backup-qa
          path: qa/android-emulator/
          if-no-files-found: warn
          retention-days: 14
