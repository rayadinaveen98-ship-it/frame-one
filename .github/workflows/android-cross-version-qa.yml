name: Frame One real-source Android upgrade migration QA

on:
  pull_request:
    paths:
      - '.github/workflows/android-cross-version-qa.yml'
      - 'scripts/android-emulator-upgrade.py'
      - 'scripts/android-emulator-learning-state.py'
      - 'scripts/android-emulator-smoke.py'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/render-brand-icons.py'
      - 'scripts/generate-offline.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-cross-version-qa.yml'
      - 'scripts/android-emulator-upgrade.py'
      - 'scripts/android-emulator-learning-state.py'
      - 'scripts/android-emulator-smoke.py'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/render-brand-icons.py'
      - 'scripts/generate-offline.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-source-to-new-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out new Frame One source at PR or main HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android API 36 and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify new source and script
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 -m py_compile scripts/android-emulator-upgrade.py scripts/android-emulator-learning-state.py scripts/android-emulator-smoke.py
          npm ci --no-audit --no-fund
          npm test
          npm run build

      # Pin the last completed three-act experience as an old-app baseline.
      # Never point this at a moving tag or branch: the comparison must
      # remain reproducible and must not depend on public APK signing.
      - name: Check out historical v0.11A4 source independently
        uses: actions/checkout@v4
        with:
          ref: b31033bca83f452d3b1891489c09f4f029ca5a58
          path: historical-frame-one
          persist-credentials: false
      - name: Build historical v0.11A4 web assets
        working-directory: historical-frame-one
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b31033bca83f452d3b1891489c09f4f029ca5a58
          npm ci --no-audit --no-fund
          npm run build

      - name: Generate one ephemeral signing key and build two genuinely different app sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/upgrade "$HOME/.android"
          chmod 700 "$HOME/.android"
          # Key stays exclusively inside this disposable job. This does NOT
          # provision a persistent key or modify the public release APK.
          test ! -e "$HOME/.android/debug.keystore"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 3072 -validity 7 \
            -dname 'CN=Frame One Cross Source Emulator QA,O=Frame One,C=IN'

          # Historical source, its actual JS/CSS and native resources -> v1.
          (
            cd historical-frame-one
            npx cap add android
            npx cap sync android
            python3 scripts/render-brand-icons.py --android
            chmod +x android/gradlew
            cd android
            ./gradlew :app:assembleDebug --no-daemon
          )
          cp historical-frame-one/android/app/build/outputs/apk/debug/app-debug.apk qa/upgrade/app-v1.apk

          # Current HEAD app source -> v2, using the identical certificate.
          npx cap add android
          npx cap sync android
          python3 scripts/render-brand-icons.py --android
          python3 -c 'from pathlib import Path; import re; p=Path("android/app/build.gradle"); s=p.read_text(); next_s,n=re.subn(r"(?m)^(\s*)versionCode\s+1\s*$",r"\g<1>versionCode 2",s); assert n==1, f"Expected exactly one generated versionCode 1; found {n}"; p.write_text(next_s)'
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk qa/upgrade/app-v2.apk

          test "$(git -C historical-frame-one rev-parse HEAD)" != "$(git rev-parse HEAD)"
          for code in 1 2; do
            apk="qa/upgrade/app-v$code.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
              | grep -F "package: name='com.frameone.learncinema' versionCode='$code'"
            unzip -Z1 "$apk" | grep -Fx 'assets/public/index.html'
          done
          cert1="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs qa/upgrade/app-v1.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          cert2="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs qa/upgrade/app-v2.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$cert1"
          test "$cert1" = "$cert2"
          # The APKs must contain different *compiled app bundles*, not
          # merely different versionCodes or signing manifests.
          old_page="$(unzip -p qa/upgrade/app-v1.apk assets/public/index.html | sha256sum | cut -d' ' -f1)"
          new_page="$(unzip -p qa/upgrade/app-v2.apk assets/public/index.html | sha256sum | cut -d' ' -f1)"
          test "$old_page" != "$new_page"
          echo "PASS: two distinct source commits and bundled pages; matching certificate, versionCode 1 to 2"
          echo "Baseline commit: $(git -C historical-frame-one rev-parse HEAD)"
          echo "Current source commit: $(git rev-parse HEAD)"

      - name: Enable KVM for real Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise old-code to new-code data retention without uninstalling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android-emulator-upgrade.py
      - name: Upload screenshot evidence (optional external service)
        id: evidence_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-real-source-upgrade-evidence
          path: qa/android-emulator/upgrade-*
          if-no-files-found: warn
          retention-days: 14
      - name: Warn when screenshots could not upload
        if: always() && steps.evidence_upload.outcome == 'failure'
        run: |
          echo "::warning::Emulator assertions and terminal logs remain authoritative, but screenshot evidence upload failed."
          echo "Screenshot upload unavailable; human visual review requires another run." >> "$GITHUB_STEP_SUMMARY"
