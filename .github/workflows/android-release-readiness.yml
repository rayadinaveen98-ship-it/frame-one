name: Frame One Android release readiness report

# Read-only audit of a completed trusted main build. No signing or publishing.
on:
  workflow_run:
    workflows: ['Frame One Android debug APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful main-branch Android debug run ID to audit'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  report:
    if: >-
      github.repository == 'rayadinaveen98-ship-it/frame-one' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
    steps:
      - name: Use trusted main-branch release-audit source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read trusted Android build metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid run ID'; exit 1; }
          mkdir -p readiness
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > readiness/source-run.json
          test "$(jq -r .name readiness/source-run.json)" = 'Frame One Android debug APK'
          test "$(jq -r .head_branch readiness/source-run.json)" = main
          test "$(jq -r .conclusion readiness/source-run.json)" = success
          test "$(jq -r .repository.full_name readiness/source-run.json)" = "$GITHUB_REPOSITORY"
          event="$(jq -r .event readiness/source-run.json)"
          [[ "$event" = push || "$event" = workflow_dispatch ]]
      - name: Download only the public build receipt
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name frame-one-android-debug-apk --dir readiness/download
          test -s readiness/download/android-qa-signature.txt
          # Never upload or echo the APK itself from this read-only report.
          mv readiness/download/android-qa-signature.txt readiness/receipt.txt
          rm -rf readiness/download
      - name: Compare with existing public preview metadata without publishing
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-preview-latest" > readiness/public-release.json; then
            python3 scripts/android-release-readiness.py \
              --run-json readiness/source-run.json \
              --receipt readiness/receipt.txt \
              --public-release-json readiness/public-release.json \
              --output readiness/ANDROID_RELEASE_READINESS.md
          else
            rm -f readiness/public-release.json
            python3 scripts/android-release-readiness.py \
              --run-json readiness/source-run.json \
              --receipt readiness/receipt.txt \
              --output readiness/ANDROID_RELEASE_READINESS.md
          fi
          cat readiness/ANDROID_RELEASE_READINESS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save non-secret readiness report
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-android-release-readiness
          path: readiness/ANDROID_RELEASE_READINESS.md
          retention-days: 30
          if-no-files-found: error
