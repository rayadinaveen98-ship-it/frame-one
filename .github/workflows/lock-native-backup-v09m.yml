name: Frame One v0.9M — lock official Capacitor backup plugins
on:
  push:
    branches: [feature/frame-one-v09m-native-backup-share]
    paths: ['.github/workflows/lock-native-backup-v09m.yml']
permissions:
  contents: write
jobs:
  lock-plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Capacitor 8 Filesystem and Share official plugins
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact @capacitor/filesystem@8 @capacitor/share@8
          npm ci --no-audit --no-fund
          npm test
      - name: Commit package.json and package-lock.json
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(android): lock Capacitor 8 native Filesystem and Share plugins'
            git push origin HEAD:feature/frame-one-v09m-native-backup-share
          fi
