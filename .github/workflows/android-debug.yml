name: Frame One Android debug APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Frame One
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source regressions
        run: npm test
      - name: Build tested website with offline assets
        run: npm run build
      - name: Generate native Android project from Capacitor 8
        run: |
          npx cap add android
          npx cap sync android
      - name: Build unsigned-for-release debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK contains the bundled web app
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/public/index.html'
      - name: Upload installable debug APK for device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
