name: Frame One Android debug APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/generate-offline.cjs'
      # Browser QA and emulator test scripts are not application assets.
      # Changes to those files must NOT republish a freshly signed APK.
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Frame One
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source regressions
        run: npm test
      - name: Build tested website with offline assets
        run: npm run build
      - name: Generate native Android project from Capacitor 8
        run: |
          npx cap add android
          npx cap sync android
      - name: Restore persistent debug signing identity when provisioned
        if: ${{ github.event_name != 'pull_request' }}
        env:
          FRAMEONE_QA_DEBUG_KEYSTORE_B64: ${{ secrets.FRAMEONE_QA_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FRAMEONE_QA_DEBUG_KEYSTORE_B64" ]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$FRAMEONE_QA_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "FRAMEONE_PERSISTENT_QA_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::FRAMEONE_QA_DEBUG_KEYSTORE_B64 not set. Android uses a temporary debug signer; installing this APK over an older one may fail."
            echo "FRAMEONE_PERSISTENT_QA_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Build unsigned-for-release debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Record Android signing certificate and mode
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > android-qa-signature.txt
          if [ "${FRAMEONE_PERSISTENT_QA_SIGNING:-false}" = "true" ]; then
            printf 'Persistent QA signer: YES (managed by GitHub Secret)\n' >> android-qa-signature.txt
          else
            printf 'Persistent QA signer: NO (temporary runner signer; not upgrade-safe)\n' >> android-qa-signature.txt
          fi
          grep -E 'certificate SHA-256 digest|Persistent QA signer' android-qa-signature.txt
      - name: Verify APK contains the bundled web app
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/public/index.html'
      - name: Stage flat APK and certificate receipt for GitHub Releases
        if: success()
        run: |
          set -euo pipefail
          mkdir -p release-dist
          cp android/app/build/outputs/apk/debug/app-debug.apk release-dist/app-debug.apk
          cp android-qa-signature.txt release-dist/android-qa-signature.txt
      - name: Upload installable debug APK for device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-android-debug-apk
          path: release-dist/
          if-no-files-found: error
          retention-days: 14
