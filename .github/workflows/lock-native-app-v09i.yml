name: Frame One v0.9I — regenerate locked native App dependency
on:
  push:
    branches: [feature/frame-one-v09i-native-back-upgrade]
    paths:
      - '.github/workflows/lock-native-app-v09i.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock-dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve official Capacitor 8 App plugin and update locked dependencies
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact @capacitor/app@8
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit both package manifest and lockfile into feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(android): lock Capacitor App 8 native Back integration'
            git push origin HEAD:feature/frame-one-v09i-native-back-upgrade
          fi
