name: Publish downloadable Frame One Android preview

on:
  # Safety: secret provisioning or successful Android builds must never
  # silently overwrite an installed test APK. Release requires explicit approval.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful main-branch Android build run ID to publish'
        required: true
        type: string
      verified_upgrade_run_id:
        description: 'Successful independent two-build Android upgrade QA run ID'
        required: true
        type: string
      physical_phone_verified:
        description: 'I tested the candidate APK on a real Android phone'
        required: true
        type: boolean
        default: false
      backup_restore_verified:
        description: 'I verified an external learning backup and restore'
        required: true
        type: boolean
        default: false
      release_approved:
        description: 'I approve replacing the public QA preview download'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: frame-one-public-android-preview
  cancel-in-progress: false

jobs:
  publish-android-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      UPGRADE_QA_RUN_ID: ${{ inputs.verified_upgrade_run_id }}
      RELEASE_TAG: android-preview-latest
    steps:
      - name: Check out trusted release policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require deliberate release approval and real-device data testing
        shell: bash
        env:
          PHONE_VERIFIED: ${{ inputs.physical_phone_verified }}
          BACKUP_VERIFIED: ${{ inputs.backup_restore_verified }}
          RELEASE_APPROVED: ${{ inputs.release_approved }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Only main can publish the Android preview'; exit 1; }
          for confirmation in "$PHONE_VERIFIED" "$BACKUP_VERIFIED" "$RELEASE_APPROVED"; do
            test "$confirmation" = true || { echo '::error::Manual physical phone, backup/restore and release confirmations are all required'; exit 1; }
          done
      - name: Verify trusted main-branch source build
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          case "$SOURCE_RUN_ID" in *[!0-9]* ) echo 'Invalid run identifier'; exit 1 ;; esac
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion + ":" + .head_branch')"
          test "$state" = "success:main"
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.name')"
          test "$workflow" = "Frame One Android debug APK"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')"
          printf 'SOURCE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
      - name: Require independent upgrade proof matching exact candidate build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPGRADE_QA_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid upgrade QA run ID'; exit 1; }
          qa_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPGRADE_QA_RUN_ID}")"
          test "$(jq -r .name <<< "$qa_metadata")" = 'Frame One independent Android APK upgrade acceptance'
          test "$(jq -r .status <<< "$qa_metadata")" = completed
          test "$(jq -r .conclusion <<< "$qa_metadata")" = success
          test "$(jq -r .head_branch <<< "$qa_metadata")" = main
          test "$(jq -r .event <<< "$qa_metadata")" = workflow_dispatch
          test "$(jq -r .repository.full_name <<< "$qa_metadata")" = "$GITHUB_REPOSITORY"
          mkdir -p qa-proof
          gh run download "$UPGRADE_QA_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name frame-one-cross-run-upgrade-proof --dir qa-proof
          python3 scripts/check-android-release-approval.py \
            --proof qa-proof/independent-upgrade.json --candidate-run-id "$SOURCE_RUN_ID"
      - name: Download and verify the existing compiled APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name frame-one-android-debug-apk --dir release
          test -s release/app-debug.apk
          test -s release/android-qa-signature.txt
          unzip -tqq release/app-debug.apk
          unzip -Z1 release/app-debug.apk | grep -qx 'assets/public/index.html'
          mv release/app-debug.apk release/FrameOne-android-debug.apk
          (cd release && sha256sum FrameOne-android-debug.apk > SHA256SUMS.txt)
      - name: Reject rollback builds and report real signing compatibility
        shell: bash
        run: |
          set -euo pipefail
          # The receipt comes from the trusted successful main Android job.
          # It contains only a public certificate fingerprint, never keys.
          new_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/android-qa-signature.txt | head -n 1)"
          [[ "$new_cert" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Missing valid Android signing certificate receipt'; exit 1; }
          if grep -Fxq 'Persistent QA signer: YES (managed by GitHub Secret)' release/android-qa-signature.txt; then
            signer='persistent'
          elif grep -Fxq 'Persistent QA signer: NO (temporary runner signer; not upgrade-safe)' release/android-qa-signature.txt; then
            signer='temporary'
          else
            echo 'Missing explicit persistent/temporary signing status'; exit 1
          fi

          mkdir -p previous
          prior_cert=''
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            previous_sha="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.target_commitish')"
            [[ "$previous_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid previous source commit'; exit 1; }
            # Out-of-order successful workflow_run events must not roll back
            # a newer published preview. Docs-only commits do not block builds.
            ancestry="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${previous_sha}...${SOURCE_SHA}" --jq '.status')"
            if [ "$ancestry" != ahead ] && [ "$ancestry" != identical ]; then
              echo "::error::Refusing to replace preview from $previous_sha with older/divergent $SOURCE_SHA ($ancestry)"
              exit 1
            fi
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'android-qa-signature.txt' --dir previous
            prior_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' previous/android-qa-signature.txt | head -n 1)"
            [[ "$prior_cert" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Missing valid previous certificate receipt'; exit 1; }
          fi

          # Never allow an accidental lost/rotated QA secret to replace the
          # public APK once a permanent signing identity has been published.
          # The rule checks only public receipts; private keys stay in the
          # Android build job's protected GitHub Actions secret.
          bash scripts/check-android-signing-continuity.sh release/android-qa-signature.txt previous/android-qa-signature.txt
          # A stable certificate alone cannot make versionCode rollbacks safe.
          # Older v0.12A2 has no versionCode receipt; allow exactly one
          # temporary-to-permanent transition, never another temporary release.
          bash scripts/check-android-qa-version-continuity.sh release/android-qa-signature.txt previous/android-qa-signature.txt

          if [ "$signer" = temporary ]; then
            printf '%s\n' '**Android signing: TEMPORARY DEBUG KEY. Do not expect in-place updates to work.** Export your learning JSON to an external location, verify it exists, then only uninstall if necessary.' > release/UPGRADE_NOTE.md
          elif [ -n "$prior_cert" ] && [ "$prior_cert" != "$new_cert" ]; then
            printf '%s\n' '**Android signing: PERSISTENT QA KEY, but it differs from the previous public build.** Back up before reinstalling this first stable-key preview. Future updates still require matching certificates and a real-device test.' > release/UPGRADE_NOTE.md
          else
            printf '%s\n' '**Android signing: PERSISTENT QA KEY.** In-place upgrades still require an identical installed certificate and real-device validation; keep an external backup.' > release/UPGRADE_NOTE.md
          fi
          if [ -n "$prior_cert" ] && [ "$prior_cert" != "$new_cert" ]; then
            printf '%s\n' '**Certificate changed from the previous published APK. Android will reject an in-place update from that APK. Back up your learning data before uninstalling it.**' >> release/UPGRADE_NOTE.md
          fi
          printf 'Current public certificate SHA-256: %s\n' "$new_cert" >> release/UPGRADE_NOTE.md
          version_code="$(sed -n 's/^Android versionCode: //p' release/android-qa-signature.txt)"
          printf 'Current Android QA versionCode: %s\n' "$version_code" >> release/UPGRADE_NOTE.md
      - name: Publish same stable direct APK URL with verified build receipt
        shell: bash
        run: |
          set -euo pipefail
          cat >release/NOTES.md <<EOF
          ## Frame One — latest Android debug APK

          **Test build only**, not Play Store ready. The current permanent package ID, Android/iOS behavior and accessibility have not been independently approved.

          Verified source commit: \`$SOURCE_SHA\`
          Verified GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID

          Download **FrameOne-android-debug.apk** from the assets below. Install it on an Android test phone and check all lessons, seven creative labs, sound playback, notes, backups, safe-area layout and offline reload.

          Export a learning backup before uninstalling an older version. No private signing keys or learner data are included in this artifact.

          EOF
          cat release/UPGRADE_NOTE.md >> release/NOTES.md
          cat >>release/NOTES.md <<EOF

          See **android-qa-signature.txt** for this build's certificate receipt. The public download URL is stable, but that does not establish Android update compatibility.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/FrameOne-android-debug.apk release/SHA256SUMS.txt release/android-qa-signature.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/NOTES.md
          else
            gh release create "$RELEASE_TAG" release/FrameOne-android-debug.apk release/SHA256SUMS.txt release/android-qa-signature.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Frame One — latest Android test APK' --prerelease --notes-file release/NOTES.md
          fi
          # android-preview-latest is deliberately a moving preview tag. The APK
          # and release notes already change on each publish; its Git ref and
          # release metadata must identify the exact build commit too.
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f target_commitish="$SOURCE_SHA" >/dev/null
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "$tag_sha" != "$SOURCE_SHA" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" -f sha="$SOURCE_SHA" -F force=true >/dev/null
          fi
      - name: Confirm downloadable release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'FrameOne-android-debug.apk'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'android-qa-signature.txt'
          # Fails publishing if the public tag or release provenance is stale.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.target_commitish')" = "$SOURCE_SHA"
