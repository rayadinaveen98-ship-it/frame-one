name: Publish downloadable Frame One Android preview

on:
  # Every verified Android build on main refreshes the same stable public URL.
  workflow_run:
    workflows: ['Frame One Android debug APK']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful main-branch Android build run ID'
        required: true
        type: string
        default: '40474407084'

permissions:
  actions: read
  contents: write

concurrency:
  group: frame-one-public-android-preview
  cancel-in-progress: false

jobs:
  publish-android-preview:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
      RELEASE_TAG: android-preview-latest
    steps:
      - name: Verify trusted main-branch source build
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          case "$SOURCE_RUN_ID" in *[!0-9]* ) echo 'Invalid run identifier'; exit 1 ;; esac
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion + ":" + .head_branch')"
          test "$state" = "success:main"
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.name')"
          test "$workflow" = "Frame One Android debug APK"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')"
          printf 'SOURCE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
      - name: Download and verify the existing compiled APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name frame-one-android-debug-apk --dir release
          test -s release/app-debug.apk
          test -s release/android-qa-signature.txt
          unzip -tqq release/app-debug.apk
          unzip -Z1 release/app-debug.apk | grep -qx 'assets/public/index.html'
          mv release/app-debug.apk release/FrameOne-android-debug.apk
          (cd release && sha256sum FrameOne-android-debug.apk > SHA256SUMS.txt)
      - name: Publish same stable direct APK URL with verified build receipt
        shell: bash
        run: |
          set -euo pipefail
          cat >release/NOTES.md <<EOF
          ## Frame One — latest Android debug APK

          **Test build only**, not Play Store ready. The current permanent package ID, Android/iOS behavior and accessibility have not been independently approved.

          Verified source commit: \`$SOURCE_SHA\`
          Verified GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID

          Download **FrameOne-android-debug.apk** from the assets below. Install it on an Android test phone and check all lessons, seven creative labs, sound playback, notes, backups, safe-area layout and offline reload.

          Export a learning backup before uninstalling an older version. No private signing keys or learner data are included in this artifact.

          See **android-qa-signature.txt** for this build's signing certificate fingerprint and whether it uses a persistent QA signer. A stable download URL alone does NOT guarantee in-place APK upgrades; Android requires the same certificate as the installed build.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/FrameOne-android-debug.apk release/SHA256SUMS.txt release/android-qa-signature.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/NOTES.md
          else
            gh release create "$RELEASE_TAG" release/FrameOne-android-debug.apk release/SHA256SUMS.txt release/android-qa-signature.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Frame One — latest Android test APK' --prerelease --notes-file release/NOTES.md
          fi
          # android-preview-latest is deliberately a moving preview tag. The APK
          # and release notes already change on each publish; its Git ref and
          # release metadata must identify the exact build commit too.
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f target_commitish="$SOURCE_SHA" >/dev/null
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "$tag_sha" != "$SOURCE_SHA" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" -f sha="$SOURCE_SHA" -F force=true >/dev/null
          fi
      - name: Confirm downloadable release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'FrameOne-android-debug.apk'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'android-qa-signature.txt'
          # Fails publishing if the public tag or release provenance is stale.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.target_commitish')" = "$SOURCE_SHA"
