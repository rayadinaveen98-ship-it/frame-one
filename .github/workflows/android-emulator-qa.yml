name: Frame One real Android emulator acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/android-emulator-qa.yml'
      - 'src/android-back.ts'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/native-safe-area.css'
      - 'src/legacy/**'
      - 'src/components/LearnView.tsx'
      - 'src/components/LessonView.tsx'
      - 'src/components/labs/**'
      - 'scripts/android-emulator-smoke.py'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-qa.yml'
      - 'src/android-back.ts'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/native-safe-area.css'
      - 'src/legacy/**'
      - 'src/components/LearnView.tsx'
      - 'src/components/LessonView.tsx'
      - 'src/components/labs/**'
      - 'scripts/android-emulator-smoke.py'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact Frame One commit
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android API 36 / build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build actual offline website and Capacitor app
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleDebug --no-daemon)
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/public/index.html'
      - name: Enable Android KVM on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android emulator and exercise native WebView Back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android-emulator-smoke.py
      - name: Upload Android device hierarchy and screenshots (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-android-emulator-evidence
          path: qa/android-emulator/
          if-no-files-found: warn
          retention-days: 14
