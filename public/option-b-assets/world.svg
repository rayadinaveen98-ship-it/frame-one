<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 980" width="420" height="980" role="img" aria-label="Illustrated film-making journey through green valleys, peach mountains, blue rivers and studio cabins">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.18" y2="1"><stop stop-color="#c9efff"/><stop offset="0.6" stop-color="#e5f8f1"/><stop offset="1" stop-color="#fdf1cf"/></linearGradient>
  <linearGradient id="far" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a6d6d4"/><stop offset="1" stop-color="#78b9af"/></linearGradient>
  <linearGradient id="middle" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#b1e8aa"/><stop offset="1" stop-color="#60b7a3"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9cd880"/><stop offset="1" stop-color="#57b88d"/></linearGradient>
  <linearGradient id="path" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7d5"/><stop offset="1" stop-color="#e8ca99"/></linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75cfd2"/><stop offset="1" stop-color="#45aaba"/></linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="shadow" x="-70%" y="-70%" width="250%" height="250%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#286879" flood-opacity=".22"/></filter>
  <g id="pine"><path d="M0 -23L-16 -1L-7 -2L-20 16L0 9L20 16L7 -2L16 -1Z" fill="#348e75" stroke="#2a8a72" stroke-width="1" stroke-linejoin="round"/><path d="M0 -19L-12 -1L-3 -3L-16 10L0 5Z" fill="#6fc49c"/><path d="M-1 7V20" stroke="#796653" stroke-width="4"/></g>
  <g id="bush"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#3d9e77"/><ellipse cx="-8" cy="-5" rx="10" ry="7" fill="#79c68d"/><ellipse cx="6" cy="-3" rx="10" ry="8" fill="#62bc85"/></g>
  <g id="star"><path d="M0 -8L2.2 -2.2L8 0L2.2 2.2L0 8L-2.2 2.2L-8 0L-2.2 -2.2Z" fill="#fff6c4"/></g>
