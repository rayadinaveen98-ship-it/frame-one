        <button class="nav-btn" data-page="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></svg>Learn Cinema</button>
        <button class="nav-btn" data-page="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></svg>Creative Lab</button>
        <button class="nav-btn" data-page="crafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 9 18-3M8 7v4m6-5v4M9 19v2m6-2v2"/></svg>Meet Film Roles</button>
      </div>
      <div class="sidebar-bottom"><div class="side-note"><strong>Learn at your pace.</strong>No account. No pressure. Just cinema.</div><button class="ghost-reset" id="resetProgress">Reset learning progress</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="welcome">A little film school, in your pocket.</div><div class="top-right"><div class="progress-pill"><span class="progress-circle" id="progressCircle" style="--angle:0%"></span><span id="progressLabel">0/8 lessons</span></div><div class="avatar" aria-hidden="true">F1</div></div></header>
      <div id="content" aria-live="polite"></div>
      <footer class="footer"><span>FRAME ONE · Learning prototype v0.2</span><span>Made for curious minds <span class="heart">♥</span></span></footer>
    </main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg><span>Home</span></button>
      <button data-page="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></svg><span>Learn</span></button>
      <button data-page="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span>Lab</span></button>
      <button data-page="crafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 9 18-3M8 7v4m6-5v4"/></svg><span>Roles</span></button>
    </nav>
  </div>
  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'frameone-progress-v01';
    const lessons = [
      {id:'why',unit:'Foundations',num:'01',title:'Why do we watch films?',subtitle:'Films can entertain us, teach us, and help us see other lives.',minutes:3,thumb:'story',icon:'◎',sections:[
        ['Why people watch','People watch films for many reasons: to enjoy a story, laugh, feel suspense, learn about the world or see another person’s point of view. Not every film tells a fictional story; documentaries can show real people and events.'],
        ['How a film makes us feel','Imagine someone waiting for a friend who does not arrive. The story can be told in one sentence. A film might show an empty chair, a passing train and the person checking the time. Images, timing, acting and sound help us experience the wait.'],
        ['People may feel different things','Two people can watch the same scene and react differently. Their experiences and expectations can shape what they notice. Filmmakers can guide feelings, but cannot guarantee one reaction from everyone.']
      ],idea:'Films can show events and ideas while using images, sound and timing to shape our experience.',try:'Watch a short scene. What did you notice first: a person, an action, a sound or a feeling?',q:'Which choice best describes what cinema can do?',opts:['Only communicate facts','Shape how we experience a story','Make every viewer feel exactly the same'],answer:1,feedback:'Images, sound, acting and editing can influence how we feel. Different viewers may still react differently.'},
      {id:'units',unit:'Foundations',num:'02',title:'Frame, shot, scene',subtitle:'Three common terms every beginner should know.',minutes:4,thumb:'shot',icon:'▣',sections:[
        ['Frame: one picture','Pause a video. The single image you see is a frame. What appears inside its edges—including people, objects and light—is part of its composition (how the picture is arranged).'],
        ['Shot: one continuous view','In a finished film, a shot is one uninterrupted view before the film changes to another shot. The camera can stay still or move during it. One shot contains many frames (individual pictures).'],
        ['Scene: one part of the action','A scene is a part of the story, often in one place and around one stretch of time. It may use one shot or several shots. A take is one attempt to record a shot; filmmakers may record several takes and choose one when editing.']
      ],idea:'Frame = one picture. Shot = one continuous view. Scene = one part of the story. Take = one recording attempt.',try:'Watch a short conversation. Count how often the image cuts to another shot. Is it still one scene?',q:'An argument is filmed in one unbroken take and shown without edits. How many shots do we see?',opts:['One shot','Always ten shots','One shot per line of dialogue'],answer:0,feedback:'One unbroken take shown without edits is one shot, even if it covers a whole scene.'},
      {id:'shot',unit:'Visual Language',num:'03',title:'What makes a shot good?',subtitle:'A good shot helps the viewer see or feel what matters.',minutes:5,thumb:'shot',icon:'◩',sections:[
        ['Pretty is not the same as useful','A shot can look beautiful but still distract us from an important moment. Ask what the audience should notice in this part of the film.'],
        ['Know what you want to show','Do viewers need to see the whole place, two people together or one small facial reaction? Choose what goes inside the frame and how you show it to support that idea.'],
        ['One shot can mean different things','A wide shot shows more of the surroundings. It might suggest loneliness—or freedom. A close-up shows detail, such as a face. It might feel warm, funny or uncomfortable. The story and nearby shots help give each choice meaning.']
      ],idea:'A shot works well when it helps communicate what matters in that moment.',try:'Open the Creative Lab and compare the same character in three shot sizes. Choose a framing for a lonely character. Explain why you picked it.',q:'What is the best first question to ask when choosing a shot?',opts:['Which lens looks most expensive?','What does this scene need the audience to experience?','Can every shot be a close-up?'],answer:1,feedback:'First decide what viewers need to see or feel. Then choose how to frame and film it.'},
      {id:'story',unit:'Storytelling',num:'04',title:'How stories create emotion',subtitle:'Expectation, surprise and character choices turn events into drama.',minutes:4,thumb:'story',icon:'✦',sections:[
        ['Give the character a reason','Imagine someone searching for a key. Now imagine that the key opens a box holding their mother’s last letter. The search matters more because we understand what the person could lose. This is what storytellers mean by the stakes.'],
        ['Make us wonder what happens next','When a character wants something, we start asking: will they get it? A problem or delay can make us more curious. Waiting for an important answer can create suspense.'],
        ['Show what someone decides','A character who is afraid to open a letter might put it away, then pick it up again. We can learn about the character from what they do, even without a speech.']
      ],idea:'We often care more when we know what a character wants, why it matters and what they choose to do.',try:'Write one sentence: ‘Someone wants ___, but ___ stands in the way.’',q:'Why does a simple problem become compelling drama?',opts:['Because it has more camera angles','Because it matters to someone and creates meaningful stakes','Because the scene uses loud music'],answer:1,feedback:'A problem can feel more important when we understand why it matters to a person.'},
      {id:'crew',unit:'Film Roles',num:'05',title:'Who actually makes a film?',subtitle:'Understand the creative teamwork behind every scene.',minutes:4,thumb:'crew',icon:'♧',sections:[
        ['Films often need teamwork','Many films are made by teams. One person may write, another may perform, while others handle camera, lighting, sound, sets and editing. On a very small film, one person might do several jobs.'],
        ['One scene, many jobs','In a rainy-night scene, the design team might prepare the setting, the camera and lighting teams decide how it looks, and the sound team records or creates what we hear. The editor chooses which shots appear and for how long. The director works with these people on the overall scene.'],
        ['What are the “24 crafts”?','In the Telugu film industry, “24 crafts” commonly refers to 24 categories of film workers represented by industry groups. It does not mean every film worldwide has exactly 24 jobs. We will start by meeting nine familiar roles and teams.']
      ],idea:'Different film jobs support one another. Working together can make a scene clearer and more powerful.',try:'Think of a film scene you love. Identify three different crafts that must have contributed to it.',q:'Who can contribute to how a scene feels?',opts:['Only the director','Only the cinematographer','Multiple collaborating departments'],answer:2,feedback:'Many people can shape a scene. On a small project, one person may also do several jobs.'},
      {id:'sound',unit:'Visual Language',num:'06',title:'Sound changes everything',subtitle:'Hear how a scene can mean something different without changing the image.',minutes:4,thumb:'sound',icon:'♫',sections:[
        ['Sound adds information','Footsteps, traffic or a ringing phone can tell us what is happening—even when we cannot see it. Background sounds also help us imagine where a scene takes place.'],
        ['Music can change a scene’s mood','Soft music might make someone waiting feel hopeful. Uneasy music might make the same wait feel frightening. These are possibilities, not guaranteed reactions.'],
        ['No music is also a choice','A scene without background music can make small sounds, such as breathing or footsteps, more noticeable. No music is not always the same as complete silence.']
      ],idea:'Sound can give information, suggest emotion and guide what we notice.',try:'Open the Sound Lab. Compare the same imagined scene with no music, gentle tones and uneasy tones. Note what story you start imagining.',q:'What can music do even if the visuals do not change?',opts:['Change the emotional expectation','Change the actor’s expression in the video','Guarantee every viewer feels the same'],answer:0,feedback:'Music can suggest a mood or raise an expectation, even when the picture stays the same.'},
      {id:'camera',unit:'Visual Language',num:'07',title:'Where should the camera go?',subtitle:'Distance and angle subtly change your relationship to a character.',minutes:4,thumb:'tech',icon:'⌗',sections:[
        ['Where the camera sits matters','The camera’s position changes what fits in the picture and which details we notice. Moving closer or farther away can change how we see a person and their surroundings.'],
        ['High and low angles','Filming someone from below can make them seem large or important. Filming from above may make them seem small. But neither angle has one fixed meaning; the scene decides how we read it.'],
        ['Move the camera for a reason','A moving camera can follow a person or reveal something new. A still camera can let us study what happens. Both are useful; decide what viewers should notice.']
      ],idea:'Ask what you want the viewer to see before choosing a camera position or movement.',try:'Place your phone at eye level, knee height and above eye level. Take three photos of the same object. Compare the feelings.',q:'What gives a low camera angle meaning?',opts:['It always means heroism','The specific scene, subject and surrounding choices','It always makes a scene better'],answer:1,feedback:'The meaning of a camera angle depends on the subject, the framing and the scene.'},
      {id:'making',unit:'Getting Started',num:'08',title:'From idea to first film',subtitle:'The simple journey from a thought to something people can watch.',minutes:5,thumb:'crew',icon:'▶',sections:[
        ['Plan a small story','Choose a simple idea. Who is in it? What do they want? Where does it happen? Write a short script (a plan for what people do and say), choose a place and list the shots you need.'],
        ['Record your shots','You can start with a phone and a quiet place. Film the actions you need from one or more useful angles. Try to keep small details—like where an object sits—the same between matching shots. Check that voices can be heard clearly.'],
        ['Put the film together','Choose your recorded shots and place them in order. Decide where to cut. Use sound or music you made yourself or have permission to use. Show the result to someone and ask what they understood.']
      ],idea:'Make one short, complete film. Watch it, learn one thing and try again.',try:'Make a 30-second film about someone discovering an unexpected message. Use five shots or fewer.',q:'What is a sensible first film project for a beginner?',opts:['A feature film with 30 locations','A short story you can finish with a few shots','A film that requires expensive cameras'],answer:1,feedback:'A small project is easier to finish, review and learn from.'}
    ];
    const crafts=[
      {id:'writing',symbol:'✍',title:'Screenwriting',desc:'Write the story and what happens in each scene.',detail:'Screenwriters plan characters, events and dialogue (what people say). Their screenplay describes what happens in the film. It is a guide for making the film, not the finished film.',link:'The director works with writers, actors and other teams to turn the script into a film.'},
      {id:'direction',symbol:'◉',title:'Directing',desc:'Guide how the story is shown and performed.',detail:'The director guides how the story is told on screen. They work with actors and other teams to make choices about performance, camera work, sound and editing.',link:'Directing works closely with writing, acting, camera, editing and sound.'},
      {id:'camera',symbol:'▣',title:'Cinematography',desc:'Plan how the film looks through the camera.',detail:'The cinematographer, also called the director of photography, plans much of the camera work and lighting with the director. They help decide how shots are framed, lit and recorded.',link:'Cinematography works closely with directing, lighting and production design.'},
      {id:'acting',symbol:'♙',title:'Acting',desc:'Show what a character thinks, feels and does.',detail:'Actors play characters through actions, facial expressions, movement and voice. They can show us what someone feels, even without speaking.',link:'Acting connects the script and the director’s ideas to what the audience sees and hears.'},
      {id:'design',symbol:'▥',title:'Production Design',desc:'Plan how the film’s places and sets look.',detail:'The production designer leads the overall look of sets and locations on screen. They work with the art department and other teams on things like furniture, colours and the world around the characters.',link:'Production design works with the director, camera and other visual teams.'},
      {id:'sound',symbol:'♫',title:'Sound',desc:'Record and shape what the audience hears.',detail:'Sound workers record voices and noises during filming. Later, sound editors and designers may clean up speech, add effects and shape the background sounds we hear.',link:'Sound works closely with directing, editing and music.'},
      {id:'editing',symbol:'⌁',title:'Editing',desc:'Choose shots and decide when they change.',detail:'The editor chooses recorded shots and arranges them in an order that makes sense. How long we see each shot, and when the film cuts, can change how a moment feels.',link:'Editing works closely with the director, sound and music teams.'},
      {id:'music',symbol:'♪',title:'Film Music',desc:'Use music to support or contrast with a scene.',detail:'Composers can write original music for a film. Filmmakers may also choose existing songs if they have permission to use them. Music may suggest a feeling—or the film may work better without it.',link:'Film music works with the director, editor and sound team.'},
      {id:'producing',symbol:'◇',title:'Producing',desc:'Help organize the people, money and plan.',detail:'Producers help make a film happen. Their work can include finding money, hiring people, planning the schedule and helping the project reach an audience. Different producers handle different parts of this work.',link:'Producing helps the creative teams get the resources and support they need.'}
    ];
    const state={page:'home',lesson:null,craft:null,lab:'frame',frame:'wide',sound:'silence',filter:'All',query:'',quiz:null,quizAnswered:false,audio:null};
    let finished=loadProgress();
    function loadProgress(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return new Set(Array.isArray(x)?x.filter(s=>lessons.some(l=>l.id===s)):[])}catch{return new Set()}}
    function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...finished]))}catch{}}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function icon(kind){const icons={story:'<circle cx="38" cy="33" r="22"/><path d="M15 69c15-11 31-11 46 0M38 12v42M20 34h36"/>',shot:'<rect x="9" y="12" width="58" height="45" rx="3"/><path d="M28 12v45m19-45v45M9 28h58M9 43h58"/>',crew:'<circle cx="38" cy="22" r="11"/><path d="M15 68V51c0-13 9-19 23-19s23 6 23 19v17M4 70h68"/>',sound:'<path d="M15 34v10m8-20v30m9-42v54m9-43v32m9-45v57m9-42v30"/>',tech:'<circle cx="38" cy="37" r="25"/><circle cx="38" cy="37" r="11"/><path d="M38 2v10m0 50v10M3 37h10m50 0h10"/>'};return `<svg viewBox="0 0 76 76" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[kind]||icons.story}</svg>`}
    function updateProgress(){let count=finished.size;let p=Math.round(count/lessons.length*100);document.getElementById('progressCircle').style.setProperty('--angle',p+'%');document.getElementById('progressLabel').textContent=`${count}/${lessons.length} lessons`}
    function lessonCard(l){return `<button class="lesson-card" data-lesson="${l.id}"><span class="card-thumb thumb-${l.thumb}">${icon(l.thumb)}</span><span class="card-meta">LESSON ${l.num} <span class="dot"></span> ${l.minutes} MIN</span><h3>${l.title}</h3><p>${l.subtitle}</p><span class="card-footer"><span class="${finished.has(l.id)?'complete':''}">${finished.has(l.id)?'✓ Completed':'Explore lesson'}</span><span aria-hidden="true">↗</span></span></button>`}
    function home(){const next=lessons.find(l=>!finished.has(l.id))||lessons[0];return `<div class="page"><section class="hero"><div class="hero-text"><div class="eyebrow">WELCOME TO THE WORLD OF CINEMA</div><h1>Learn to <em>see</em><br>the story.</h1><p>Why do movies move us? How do filmmakers build a scene? Discover the art of film, one simple idea at a time.</p><button class="cta" data-lesson="${next.id}">${finished.size?'Continue learning':'Start your first lesson'} <span aria-hidden="true">→</span></button></div><div class="hero-art"><div class="hero-grain"></div><div class="hero-figure"></div></div><div class="hero-caption">A STORY BEGINS HERE / 001</div></section><div class="section-head"><div><span class="eyebrow-secondary">YOUR FIRST STEPS</span><h2>Start with the basics</h2></div><button class="text-link" data-page="learn">All lessons →</button></div><div class="card-grid">${lessons.slice(0,3).map(lessonCard).join('')}</div><div class="section-head"><div><span class="eyebrow-secondary">TRY IT, DON'T JUST READ IT</span><h2>Make a creative choice</h2></div></div><div class="mid-grid"><div class="feature-panel"><span class="eyebrow">INTERACTIVE LAB</span><h3>One character.<br>Three ways to frame a person.</h3><p>Make the same person appear larger or smaller in the frame. Notice what you pay attention to.</p><button class="cta" data-page="lab">Try the Frame Lab →</button></div><div class="fact-panel"><span class="eyebrow-secondary">A LITTLE FILM THOUGHT</span><h3>There's no single “best” shot.</h3><p>The most useful question is not “Does this look cinematic?” but “What is this shot helping the audience feel or understand?”</p><div class="fact-line"><span aria-hidden="true">✦</span><span>Curiosity is your first filmmaking tool.</span></div></div></div></div>`}
    function learn(){let choices=['All','Foundations','Visual Language','Storytelling','Film Roles','Getting Started'];let matches=lessons.filter(l=>(state.filter==='All'||l.unit===state.filter)&&`${l.title} ${l.subtitle} ${l.unit}`.toLowerCase().includes(state.query.toLowerCase()));return `<div class="page"><div class="page-intro"><div class="eyebrow">YOUR FILM SCHOOL</div><h1>Learn how cinema works.</h1><p>Eight short, beginner-friendly lessons. Learn at your own pace, answer a question, then try what you discovered. No film vocabulary required.</p></div><div class="search-row"><label class="sr-only" for="lessonSearch">Search lessons</label><input class="learn-search" id="lessonSearch" type="search" placeholder="Find a topic, like shots or sound..." value="${escapeHtml(state.query)}"><small>${finished.size} of ${lessons.length} finished</small></div><div class="filter-row">${choices.map(c=>`<button class="filter-chip" data-filter="${escapeHtml(c)}" aria-pressed="${state.filter===c}">${c}</button>`).join('')}</div><div class="list-grid" id="lessonList">${matches.map(l=>`<button class="list-card" data-lesson="${l.id}"><span class="list-icon">${icon(l.thumb)}</span><span class="list-info"><span class="eyebrow-secondary">${l.unit} · ${l.minutes} min</span><h3>${l.title}</h3><p>${finished.has(l.id)?'✓ Completed':l.subtitle}</p></span><span class="tail" aria-hidden="true">↗</span></button>`).join('')||'<div class="empty">No matching lessons. Try another search.</div>'}</div></div>`}
    function lessonPage(){const l=lessons.find(x=>x.id===state.lesson)||lessons[0];const answered=state.quizAnswered;return `<div class="page lesson-view"><button class="back-btn" data-page="learn">← Back to all lessons</button><div class="lesson-top"><div class="eyebrow">LESSON ${l.num} · ${l.unit.toUpperCase()} · ${l.minutes} MIN READ</div><h1>${l.title}</h1><p>${l.subtitle}</p></div><article class="lesson-body"><div class="reading-note">A little at a time. You don't need to memorize everything.</div>${l.sections.map(s=>`<section class="lesson-section"><h3>${s[0]}</h3><p>${s[1]}</p></section>`).join('')}<aside class="key-idea"><strong>THE BIG IDEA</strong><p>${l.idea}</p></aside><aside class="exercise"><strong>✦ TRY THIS YOURSELF</strong><p>${l.try}</p></aside><section class="quiz"><span class="eyebrow-secondary">A QUICK CHECK-IN</span><h3>${l.q}</h3><div class="quiz-options">${l.opts.map((o,i)=>`<button class="quiz-option ${answered&&state.quiz===i?(i===l.answer?'right':'wrong'):''} ${answered&&i===l.answer?'right':''}" data-answer="${i}" ${answered?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="quiz-feedback ${answered&&state.quiz!==l.answer?'error':''}" role="status">${answered?(state.quiz===l.answer?'✓ Exactly. ': 'Not quite. ')+l.feedback:''}</div><div class="lesson-actions">${answered&&state.quiz!==l.answer?'<button class="btn-secondary" data-retry>Try again</button>':''}<button class="cta" data-complete ${!answered||state.quiz!==l.answer?'disabled':''}>${finished.has(l.id)?'✓ Lesson complete':'Mark lesson complete'} →</button></div></section></article></div>`}
    const frameOpts={wide:{label:'Wide shot',sub:'See more of the surroundings',description:'The person looks smaller and we see more of the place around them. Depending on the story, this might suggest loneliness, freedom or the size of the location.',scale:.55},medium:{label:'Medium shot',sub:'Notice gestures and some surroundings',description:'The person takes up more of the picture. We can notice gestures while still seeing some of the space around them. Medium shots are common in conversations.',scale:1},close:{label:'Close-up',sub:'Notice the face and small reactions',description:'The face takes up more of the picture, so small expressions become easier to notice. A close-up can feel warm, funny or tense depending on the scene.',scale:1.8}};
    const soundOpts={silence:{label:'No music',sub:'No sound plays in this demo',description:'This option plays no audio. In a real film, a scene without music could still contain voices, traffic, footsteps or other sounds.'},warm:{label:'Gentle tones',sub:'Soft, higher musical notes',description:'These simple notes might make the imagined wait feel calm or hopeful. This is just a sound sketch, not a full piece of music.'},tension:{label:'Uneasy tones',sub:'Low notes that shift slightly',description:'These low notes might make the imagined wait feel uncertain or tense. The picture we are imagining has not changed.'}};
    function scene(){let cfg=frameOpts[state.frame];return `<div class="scene-stage"><div class="actor" style="--scale:${cfg.scale}"><div class="head"></div><div class="body"></div><div class="legs"></div></div><div class="frame-guides"><div class="crossline"></div></div><div class="frame-corner">REC · SCENE 01</div><div class="scene-label">${cfg.label.toUpperCase()} / SAME CHARACTER</div></div>`}
    function soundScene(){return `<div class="scene-stage"><div class="sound-vis ${state.sound}">${Array.from({length:23},(_,i)=>`<span class="bar" style="--h:${(20+Math.abs(Math.sin(i*.7)*116)).toFixed(0)}px;--delay:${(i*.11).toFixed(2)}s"></span>`).join('')}<div class="music-caption">IMAGINE ONE SCENE / TRY THREE SOUNDS</div></div><div class="frame-corner">SCENE 01 · AUDIO LAB</div></div>`}
    function lab(){const isFrame=state.lab==='frame';const opts=isFrame?frameOpts:soundOpts;const selected=isFrame?state.frame:state.sound;return `<div class="page"><div class="page-intro"><div class="eyebrow">THE CREATIVE LAB</div><h1>Don't just learn it. Feel it.</h1><p>Change one thing at a time. Notice what grabs your attention and what feeling you imagine. Different people may read it differently.</p></div><div class="lab-tabs"><button class="lab-tab" data-lab="frame" aria-pressed="${isFrame}">▣ Frame Lab</button><button class="lab-tab" data-lab="sound" aria-pressed="${!isFrame}">♫ Sound Lab</button></div><div class="lab-shell"><div class="lab-preview">${isFrame?scene():soundScene()}<div class="lab-hint">${isFrame?'Simple illustration · Same person, different framing (not a real camera simulation)':'Audio sketch · Simple computer-made tones, not finished film music'}</div></div><div class="lab-panel"><div class="eyebrow">${isFrame?'EXPERIMENT 01':'EXPERIMENT 02'}</div><h3>${isFrame?'Change how large the person appears.':'Change the sound sketch.'}</h3><p>${isFrame?'Imagine the person is waiting for someone. Try each framing. What do you notice first?':'Imagine the same person waiting at a station each time. Listen to different tones and see how your expectations change.'}</p><div class="lab-choices">${Object.entries(opts).map(([id,o])=>`<button class="lab-choice" data-${isFrame?'frame':'sound'}="${id}" aria-pressed="${selected===id}"><strong>${o.label}</strong><span>${o.sub}</span></button>`).join('')}</div><div class="result-box"><strong>ONE WAY TO READ THIS CHOICE</strong><p>${opts[selected].description}</p></div>${isFrame?'<button class="btn-secondary" style="margin-top:20px" data-lab="sound">Now try sound →</button>':`<div class="lesson-actions"><button class="btn-secondary" data-audio="play" ${state.sound==='silence'?'disabled':''}>▶ Hear a short original tone</button><button class="btn-secondary" data-audio="stop">■ Stop</button></div><p style="font-size:11px;color:#9094a0;margin-top:12px">Your browser plays basic computer-made tones. They are not a film score, and may not create the same feeling for everyone. Keep volume low.</p>`}</div></div><div class="section-head"><div><span class="eyebrow-secondary">NEXT CONNECTION</span><h2>Take the idea back to the lesson</h2></div></div><div class="mid-grid"><div class="fact-panel"><h3>What makes a shot good?</h3><p>Framing can guide the viewer’s attention. Learn how to choose a shot for a reason.</p><button class="btn-secondary" data-lesson="shot">Read the lesson →</button></div><div class="fact-panel"><h3>Sound changes everything</h3><p>See how music, background sound or no music can affect a scene.</p><button class="btn-secondary" data-lesson="sound">Read the lesson →</button></div></div></div>`}
    function craftsPage(){let c=crafts.find(x=>x.id===state.craft);return `<div class="page"><div class="page-intro"><div class="eyebrow">THE PEOPLE BEHIND THE MAGIC</div><h1>Meet the film roles.</h1><p>Many films are made by teams working together. Choose a role to learn what that person or team does.</p></div><div class="info-banner"><strong>About the “24 crafts”:</strong> In the Telugu film industry, “24 crafts” commonly refers to 24 categories of film workers. It is not one worldwide list of exactly 24 film jobs. These nine cards are an introduction, not the full federation list.</div>${c?`<div class="craft-detail" id="craftDetail"><button class="back-btn" data-craft="">← All roles</button><h3>${c.symbol} ${c.title}</h3><p>${c.detail}</p><div class="craft-connection"><strong>How it connects:</strong> ${c.link}</div></div>`:''}<div class="crafts-grid">${crafts.map(c=>`<button class="craft-card" data-craft="${c.id}"><span class="craft-icon">${c.symbol}</span><h3>${c.title}</h3><p>${c.desc}</p></button>`).join('')}</div></div>`}
    function navigate(page,sub=null){stopAudio();if(page==='lesson'){state.page='lesson';state.lesson=sub;state.quiz=null;state.quizAnswered=false}else{state.page=page;state.lesson=null}if(page!=='crafts')state.craft=null;render();window.scrollTo({top:0,behavior:'instant'});try{history.replaceState(null,'','#'+(page==='lesson'?'lesson/'+sub:page))}catch{}}
    function render(){const root=document.getElementById('content');root.innerHTML=state.page==='home'?home():state.page==='learn'?learn():state.page==='lesson'?lessonPage():state.page==='lab'?lab():craftsPage();document.querySelectorAll('[data-page]').forEach(el=>{if(el.closest('.sidebar')||el.closest('.mobile-nav')){if(el.dataset.page===state.page||(state.page==='lesson'&&el.dataset.page==='learn'))el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')}});updateProgress()}
    function nextLesson(id){const i=lessons.findIndex(l=>l.id===id);return lessons[i+1]||null}
    function answerQuiz(n){if(state.page!=='lesson'||state.quizAnswered)return;state.quiz=n;state.quizAnswered=true;render();document.querySelector('.quiz')?.scrollIntoView({block:'nearest'})}
    function markComplete(){const l=lessons.find(x=>x.id===state.lesson);if(!l||!state.quizAnswered||state.quiz!==l.answer)return;finished.add(l.id);persist();updateProgress();const next=nextLesson(l.id);if(next)navigate('lesson',next.id);else navigate('learn')}
    function stopAudio(){if(state.audio){try{state.audio.stop()}catch{}state.audio=null}}
    function playAudio(){stopAudio();if(state.sound==='silence')return;const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;let ctx;try{ctx=new AudioContext()}catch{return}let active=true;const notes=[];const start=ctx.currentTime+.08;const warm=state.sound==='warm';const freqs=warm?[261.63,329.63,392,523.25,392,329.63]:[110,116.54,110,103.83,116.54,110];for(let i=0;i<6;i++){const osc=ctx.createOscillator(),gain=ctx.createGain(),t=start+i*(warm?.39:.43);osc.type=warm?'sine':'triangle';osc.frequency.setValueAtTime(freqs[i],t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(warm?.075:.047,t+.08);gain.gain.exponentialRampToValueAtTime(.0001,t+(warm?.85:.45));osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+(warm?.9:.5));notes.push(osc)}state.audio={stop:()=>{if(!active)return;active=false;notes.forEach(o=>{try{o.stop()}catch{}});ctx.close().catch(()=>{})}};ctx.resume().catch(()=>{});const end=start+(warm?3.2:2.8);const stopper=ctx.createOscillator(),g=ctx.createGain();g.gain.value=0;stopper.connect(g);g.connect(ctx.destination);stopper.onended=()=>{if(state.audio){state.audio=null;ctx.close().catch(()=>{})}};stopper.start(end);stopper.stop(end+.01)}
    document.addEventListener('click',e=>{const target=e.target.closest('button, a');if(!target)return;if(target.id==='brand'){e.preventDefault();navigate('home')}else if('lesson'in target.dataset)navigate('lesson',target.dataset.lesson);else if('page'in target.dataset)navigate(target.dataset.page);else if('filter'in target.dataset){state.filter=target.dataset.filter;render()}else if('answer'in target.dataset)answerQuiz(Number(target.dataset.answer));else if('retry'in target.dataset){state.quiz=null;state.quizAnswered=false;render()}else if('complete'in target.dataset)markComplete();else if('lab'in target.dataset){state.lab=target.dataset.lab;stopAudio();render()}else if('frame'in target.dataset){state.frame=target.dataset.frame;render()}else if('sound'in target.dataset){state.sound=target.dataset.sound;stopAudio();render()}else if('audio'in target.dataset){if(target.dataset.audio==='play')playAudio();else stopAudio()}else if('craft'in target.dataset){state.craft=target.dataset.craft||null;render();if(state.craft)document.getElementById('craftDetail')?.scrollIntoView({block:'nearest',behavior:'smooth'})}else if(target.id==='resetProgress'){if(confirm('Reset your completed lessons? This cannot be undone.')){finished.clear();persist();render()}}});
    document.addEventListener('input',e=>{if(e.target.id==='lessonSearch'){state.query=e.target.value;const matches=lessons.filter(l=>(state.filter==='All'||l.unit===state.filter)&&`${l.title} ${l.subtitle} ${l.unit}`.toLowerCase().includes(state.query.toLowerCase()));const list=document.getElementById('lessonList');if(list)list.innerHTML=matches.map(l=>`<button class="list-card" data-lesson="${l.id}"><span class="list-icon">${icon(l.thumb)}</span><span class="list-info"><span class="eyebrow-secondary">${l.unit} · ${l.minutes} min</span><h3>${l.title}</h3><p>${finished.has(l.id)?'✓ Completed':l.subtitle}</p></span><span class="tail" aria-hidden="true">↗</span></button>`).join('')||'<div class="empty">No matching lessons. Try another search.</div>'}});
    window.addEventListener('pagehide',stopAudio);
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
    const hash=decodeURIComponent(location.hash.replace(/^#/,''));if(hash.startsWith('lesson/')&&lessons.some(l=>l.id===hash.split('/')[1]))navigate('lesson',hash.split('/')[1]);else if(['home','learn','lab','crafts'].includes(hash))navigate(hash);else render();
  })();
  </script>
</body>
