<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d11">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <meta name="description" content="Frame One — a beginner-friendly, interactive introduction to the art of filmmaking.">
  <title>Frame One — Learn to See Cinema</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="logo" href="#home" id="brand"><span class="logo-mark" aria-hidden="true">▧</span><span class="logo-type">FRAME ONE<span>THE ART OF FILM</span></span></a>
      <div class="nav-menu">
        <div class="nav-label">Explore</div>
        <button class="nav-btn" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg>Home</button>
        <button class="nav-btn" data-page="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></svg>Learn Cinema</button>
        <button class="nav-btn" data-page="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></svg>Creative Lab</button>
        <button class="nav-btn" data-page="crafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 9 18-3M8 7v4m6-5v4M9 19v2m6-2v2"/></svg>Meet Film Roles</button>
      </div>
      <div class="sidebar-bottom"><div class="side-note"><strong>Learn at your pace.</strong>No account. No pressure. Just cinema.</div><button class="ghost-reset" id="resetProgress">Reset learning progress</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="welcome">A little film school, in your pocket.</div><div class="top-right"><div class="progress-pill"><span class="progress-circle" id="progressCircle" style="--angle:0%"></span><span id="progressLabel">0/33 lessons</span></div><div class="avatar" aria-hidden="true">F1</div></div></header>
      <div id="content"></div>
      <footer class="footer"><span>FRAME ONE · Web beta v0.9</span><span>Made for curious minds <span class="heart">♥</span></span></footer>
    </main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg><span>Home</span></button>
      <button data-page="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></svg><span>Learn</span></button>
      <button data-page="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span>Lab</span></button>
      <button data-page="crafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 9 18-3M8 7v4m6-5v4"/></svg><span>Roles</span></button>
    </nav>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
